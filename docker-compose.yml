services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: fin_rag_pg
    environment:
      POSTGRES_DB: fin_rag
      POSTGRES_USER: fin
      POSTGRES_PASSWORD: fin_local_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fin -d fin_rag"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
